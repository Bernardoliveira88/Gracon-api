version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexusdoc-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: nexusdoc
    volumes:
      - nexusdoc-pgdata:/var/lib/postgresql/data

volumes:
  nexusdoc-pgdata: